name: Build Nabdak Containers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/AI/**'
      - 'apps/Backend/**'
      - '.github/workflows/build-containers.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: omarbazooka

jobs:
  build-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build AI image
        shell: bash
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t ghcr.io/omarbazooka/nabdak-ai:latest \
            -t ghcr.io/omarbazooka/nabdak-ai:${{ github.sha }} \
            ./apps/AI

      - name: Push AI image
        shell: bash
        run: |
          docker push ghcr.io/omarbazooka/nabdak-ai:latest
          docker push ghcr.io/omarbazooka/nabdak-ai:${{ github.sha }}

  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build API image
        shell: bash
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t ghcr.io/omarbazooka/nabdak-api:latest \
            -t ghcr.io/omarbazooka/nabdak-api:${{ github.sha }} \
            ./apps/Backend

      - name: Push API image
        shell: bash
        run: |
          docker push ghcr.io/omarbazooka/nabdak-api:latest
          docker push ghcr.io/omarbazooka/nabdak-api:${{ github.sha }}
