name: Build Nabdak Containers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/AI/**'
      - 'apps/Backend/**'
      - '.github/workflows/build-containers.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AI image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/AI
          file: ./apps/AI/Dockerfile
          push: true
          tags: |
            ghcr.io/omarbazooka/nabdak-ai:latest
            ghcr.io/omarbazooka/nabdak-ai:${{ github.sha }}
          cache-from: type=gha,scope=nabdak-ai
          cache-to: type=gha,mode=max,scope=nabdak-ai

  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/Backend
          file: ./apps/Backend/Dockerfile
          push: true
          tags: |
            ghcr.io/omarbazooka/nabdak-api:latest
            ghcr.io/omarbazooka/nabdak-api:${{ github.sha }}
          cache-from: type=gha,scope=nabdak-api
          cache-to: type=gha,mode=max,scope=nabdak-api
