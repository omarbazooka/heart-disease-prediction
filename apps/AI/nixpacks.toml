[phases.setup]
# Debian/Ubuntu apt packages for WeasyPrint
# libglib2.0-0 provides libgobject-2.0-0 (REQUIRED by WeasyPrint)
aptPkgs = [
  "libcairo2",
  "libglib2.0-0",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libgdk-pixbuf2.0-0",
  "libffi-dev",
  "shared-mime-info",
  "fonts-liberation",
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium --with-deps || true",
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
