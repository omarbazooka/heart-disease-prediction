[phases.setup]
# System packages needed for WeasyPrint (Cairo, Pango, GDK-PixBuf) and Chromium
nixPkgs = [
  "python311",
  "cairo",
  "pango",
  "gdk-pixbuf",
  "libffi",
  "zlib",
  "fontconfig",
  "freetype",
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  # Install Chromium for Playwright (headless PDF fallback)
  "playwright install chromium --with-deps || true",
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
